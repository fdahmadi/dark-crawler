<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dark Crawler{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand">Dark Crawler</div>
        <h1>{% block heading %}Status{% endblock %}</h1>
      </div>
      <nav class="nav">
        <a href="/" class="{% if active == 'status' %}active{% endif %}">Status</a>
        <a href="/pages" class="{% if active == 'pages' %}active{% endif %}">Pages</a>
        <a href="/db" class="{% if active == 'db' %}active{% endif %}">Database</a>
        <a href="/cookies" class="{% if active == 'cookies' %}active{% endif %}">Cookies</a>
        <a href="/mirror/" class="{% if active == 'mirror' %}active{% endif %}">Mirror</a>
        <a href="/api/stats">API</a>
      </nav>
    </header>
    {% if alert %}
    <div class="alert-banner" role="alert">{{ alert }} <a href="/cookies">Update cookies</a></div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
